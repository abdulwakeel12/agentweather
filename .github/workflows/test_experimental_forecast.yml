name: Test Experimental Forecast

on:
  workflow_dispatch:
    inputs:
      checkpoint_source:
        description: "Checkpoint to restore"
        required: true
        default: latest_artifact
        type: choice
        options:
          - latest_artifact
          - recovery_release

  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: agentweather-experimental-test
  cancel-in-progress: false

jobs:
  test-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "-1"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
      RELEASE_TAG: experimental-models-v1

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download published bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-test/bundles
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir cloud-test/bundles \
            --pattern "selected_models.zip" \
            --pattern "selected_models.zip.sha256" \
            --pattern "initial_history_checkpoint.zip" \
            --pattern "initial_history_checkpoint.zip.sha256"

      - name: Verify and restore bundles
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          bundle_dir = root / "cloud-test/bundles"
          report_dir = root / "cloud-test"


          def file_hash(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(1024 * 1024), b""
                  ):
                      digest.update(chunk)
              return digest.hexdigest()


          def restore_bundle(filename, checkpoint=False):
              archive_path = bundle_dir / filename
              checksum_path = bundle_dir / f"{filename}.sha256"
              checksum_parts = checksum_path.read_text(
                  encoding="utf-8"
              ).strip().split()

              if len(checksum_parts) != 2:
                  raise ValueError(
                      f"Invalid checksum file: {checksum_path.name}"
                  )

              expected_hash, expected_name = checksum_parts

              if expected_name != filename:
                  raise ValueError(
                      f"Checksum filename mismatch: {filename}"
                  )

              if not re.fullmatch(r"[0-9a-fA-F]{64}", expected_hash):
                  raise ValueError(f"Invalid SHA-256: {filename}")

              if file_hash(archive_path) != expected_hash.lower():
                  raise ValueError(
                      f"Archive checksum mismatch: {filename}"
                  )

              with ZipFile(archive_path) as archive:
                  names = archive.namelist()

                  if len(names) != len(set(names)):
                      raise ValueError(
                          f"Duplicate archive members: {filename}"
                      )

                  manifest = json.loads(
                      archive.read("bundle_manifest.json")
                  )
                  members = manifest["files"]
                  expected_members = (
                      set(members) | {"bundle_manifest.json"}
                  )

                  if set(names) != expected_members:
                      raise ValueError(
                          f"Unexpected archive contents: {filename}"
                      )

                  # Verify every member before restoring files.
                  for relative, metadata in members.items():
                      path = PurePosixPath(relative)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or "\\" in relative
                          or ":" in relative
                      ):
                          raise ValueError(
                              f"Unsafe archive path: {relative}"
                          )

                      if checkpoint:
                          allowed = (
                              relative
                              == "data/experimental_state/history.csv"
                          )
                      else:
                          allowed = (
                              relative == "evaluation_plan.json"
                              or relative == "data/splits/train.csv"
                              or relative.startswith("data/models/")
                          )

                      if not allowed:
                          raise ValueError(
                              f"Unexpected file: {relative}"
                          )

                      info = archive.getinfo(relative)
                      mode = info.external_attr >> 16

                      if info.is_dir() or stat.S_ISLNK(mode):
                          raise ValueError(
                              f"Invalid archive member: {relative}"
                          )

                      target = root.joinpath(*path.parts)
                      target.resolve().relative_to(root)

                      digest = hashlib.sha256()
                      size = 0

                      with archive.open(relative) as handle:
                          for chunk in iter(
                              lambda: handle.read(1024 * 1024), b""
                          ):
                              digest.update(chunk)
                              size += len(chunk)

                      if (
                          digest.hexdigest() != metadata["sha256"]
                          or size != metadata["bytes"]
                      ):
                          raise ValueError(
                              f"Member verification failed: {relative}"
                          )

                      if target.exists():
                          if not target.is_file():
                              raise ValueError(
                                  f"Destination is not a file: {relative}"
                              )

                          if file_hash(target) != metadata["sha256"]:
                              if relative == "evaluation_plan.json":
                                  repository_plan = json.loads(
                                      target.read_text(
                                          encoding="utf-8-sig"
                                      )
                                  )
                                  release_plan = json.loads(
                                      archive.read(relative).decode(
                                          "utf-8-sig"
                                      )
                                  )

                                  if repository_plan != release_plan:
                                      raise ValueError(
                                          "Evaluation plan settings differ "
                                          "between repository and release. "
                                          "Review both plans before continuing."
                                      )

                                  print(
                                      "Evaluation plan settings match; "
                                      "only file formatting differs."
                                  )
                              else:
                                  raise ValueError(
                                      "Repository file differs from release: "
                                      f"{relative}"
                                  )

                  for relative in members:
                      target = root.joinpath(
                          *PurePosixPath(relative).parts
                      )

                      if target.exists():
                          continue

                      target.parent.mkdir(
                          parents=True, exist_ok=True
                      )

                      with archive.open(relative) as source:
                          with target.open("xb") as destination:
                              shutil.copyfileobj(source, destination)

              manifest_path = (
                  report_dir / f"{archive_path.stem}_manifest.json"
              )
              manifest_path.write_text(
                  json.dumps(manifest, indent=2),
                  encoding="utf-8",
              )

              print(f"Verified and restored: {filename}")
              return manifest


          models = restore_bundle("selected_models.zip")
          restore_bundle(
              "initial_history_checkpoint.zip",
              checkpoint=True,
          )

          packages = models["environment"]["packages"]
          required_packages = [
              "numpy",
              "pandas",
              "scikit-learn",
              "scipy",
              "joblib",
              "tensorflow",
              "keras",
              "statsmodels",
              "requests",
          ]

          requirements = []

          for name in required_packages:
              package_version = packages[name]

              if not re.fullmatch(
                  r"[0-9A-Za-z.+!_-]+", package_version
              ):
                  raise ValueError(
                      f"Invalid package version for {name}"
                  )

              requirements.append(f"{name}=={package_version}")

          requirements_path = (
              report_dir / "inference-requirements.txt"
          )
          requirements_path.write_text(
              "\n".join(requirements) + "\n",
              encoding="utf-8",
          )

          print("\nRecorded inference dependencies:")
          print(requirements_path.read_text(encoding="utf-8"))
          print("Bundle verification completed.")
          PY

      - name: Download latest successful checkpoint
        if: github.event_name == 'schedule' || inputs.checkpoint_source == 'latest_artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          workflow = "test_experimental_forecast.yml"

          endpoint = (
              f"repos/{repository}/actions/workflows/{workflow}/runs"
              "?branch=main&status=success&per_page=100"
          )

          response = subprocess.run(
              ["gh", "api", endpoint],
              check=True,
              capture_output=True,
              text=True,
          )
          payload = json.loads(response.stdout)

          candidates = [
              run
              for run in payload["workflow_runs"]
              if run["id"] != current_run
              and run["head_branch"] == "main"
              and run["status"] == "completed"
              and run["conclusion"] == "success"
          ]

          if not candidates:
              raise RuntimeError(
                  "No previous successful workflow run found. "
                  "Stopping instead of reverting to the initial checkpoint."
              )

          selected = max(
              candidates,
              key=lambda run: (
                  run["run_number"],
                  run["run_attempt"],
              ),
          )

          run_id = selected["id"]
          attempt = selected["run_attempt"]
          artifact_name = f"experimental-test-{run_id}-{attempt}"
          destination = Path("cloud-test/previous-run")

          subprocess.run(
              [
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repository,
                  "--name",
                  artifact_name,
                  "--dir",
                  str(destination),
              ],
              check=True,
          )

          selection = {
              "workflow_run_id": run_id,
              "workflow_run_number": selected["run_number"],
              "workflow_run_attempt": attempt,
              "artifact_name": artifact_name,
              "head_sha": selected["head_sha"],
              "url": selected["html_url"],
          }

          Path("cloud-test/checkpoint_selection.json").write_text(
              json.dumps(selection, indent=2),
              encoding="utf-8",
          )

          print("Selected previous successful workflow run:", run_id)
          print("Workflow run number:", selected["run_number"])
          print("Artifact:", artifact_name)
          print("Missing or expired artifacts cause this step to fail.")
          PY

      - name: Verify and restore previous history
        if: github.event_name == 'schedule' || inputs.checkpoint_source == 'latest_artifact'
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path.cwd()
          previous = root / "cloud-test/previous-run"

          selection = json.loads(
              (root / "cloud-test/checkpoint_selection.json").read_text(
                  encoding="utf-8"
              )
          )

          forecast_root = previous / "data/experimental_forecasts"
          logs = sorted(
              forecast_root.glob("*/execution_log.json")
          )

          if len(logs) != 1:
              raise ValueError(
                  "Expected exactly one pipeline execution log "
                  f"in the downloaded artifact; found {len(logs)}."
              )

          log_path = logs[0]
          previous_run = log_path.parent
          log = json.loads(
              log_path.read_text(encoding="utf-8")
          )

          if log.get("status") != "success":
              raise ValueError(
                  "Previous pipeline did not complete successfully."
              )

          if log.get("run_id") != previous_run.name:
              raise ValueError(
                  "Previous pipeline run ID does not match its folder."
              )

          if log.get("mode") != "experimental_mixed_source":
              raise ValueError("Unexpected previous pipeline mode.")

          plan = json.loads(
              (root / "evaluation_plan.json").read_text(
                  encoding="utf-8-sig"
              )
          )

          if log.get("selected_models") != plan["selected_models"]:
              raise ValueError(
                  "Previous run used different selected models."
              )

          checkpoint = (
              previous / "data/experimental_state/history.csv"
          )
          run_history = previous_run / "input_history.csv"

          for path in (checkpoint, run_history):
              if not path.is_file():
                  raise FileNotFoundError(
                      f"Required previous-run file missing: {path}"
                  )

          content = checkpoint.read_bytes()
          digest = hashlib.sha256(content).hexdigest()

          if digest != log["input_history_sha256"]:
              raise ValueError(
                  "Previous checkpoint checksum mismatch."
              )

          if content != run_history.read_bytes():
              raise ValueError(
                  "Checkpoint differs from the previous run's input history."
              )

          rows = list(
              csv.DictReader(
                  io.StringIO(content.decode("utf-8-sig"))
              )
          )

          if not rows or len(rows) != log["history_rows"]:
              raise ValueError(
                  "Previous checkpoint row count mismatch."
              )

          last_hour = datetime.fromisoformat(
              rows[-1]["hour_utc"]
          )
          previous_cutoff = datetime.fromisoformat(
              log["input_cutoff_utc"]
          )

          if last_hour != previous_cutoff:
              raise ValueError(
                  "Previous checkpoint cutoff mismatch."
              )

          destination = (
              root / "data/experimental_state/history.csv"
          )

          if not destination.is_file():
              raise FileNotFoundError(
                  "Release checkpoint was not restored."
              )

          original_rows = list(
              csv.DictReader(
                  io.StringIO(
                      destination.read_text(encoding="utf-8-sig")
                  )
              )
          )

          if not original_rows:
              raise ValueError("Release checkpoint is empty.")

          original_cutoff = datetime.fromisoformat(
              original_rows[-1]["hour_utc"]
          )

          if last_hour < original_cutoff:
              raise ValueError(
                  "Selected checkpoint is older than the release checkpoint."
              )

          temporary = destination.with_suffix(".restore.tmp")
          temporary.write_bytes(content)
          temporary.replace(destination)

          report = {
              "checkpoint_source": "latest_artifact",
              "source_workflow_run": selection["workflow_run_id"],
              "source_pipeline_run": log["run_id"],
              "restored_rows": len(rows),
              "restored_cutoff_utc": last_hour.isoformat(),
              "sha256": digest,
              "verification": "passed",
          }

          (root / "cloud-test/checkpoint_restore.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )

          print("Latest successful checkpoint restored.")
          print("Source workflow run:", selection["workflow_run_id"])
          print("Source pipeline run:", log["run_id"])
          print("History rows:", len(rows))
          print("Input cutoff:", last_hour.isoformat())
          print("Checksum verification: PASS")
          PY

      - name: Download recovery release
        if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_source == 'recovery_release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download experimental-state-45075782033-1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir cloud-test/recovery-release \
            --pattern "history_checkpoint.zip" \
            --pattern "history_checkpoint.zip.sha256"

      - name: Verify and restore recovery release
        if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_source == 'recovery_release'
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd()
          folder = root / "cloud-test/recovery-release"
          archive_path = folder / "history_checkpoint.zip"
          checksum_path = folder / "history_checkpoint.zip.sha256"

          checksum_parts = checksum_path.read_text(
              encoding="utf-8"
          ).strip().split()

          if len(checksum_parts) != 2:
              raise ValueError("Invalid archive checksum file.")

          expected_hash, expected_name = checksum_parts

          if expected_name != archive_path.name:
              raise ValueError("Archive checksum filename mismatch.")

          if not re.fullmatch(r"[0-9a-fA-F]{64}", expected_hash):
              raise ValueError("Invalid archive SHA-256.")

          archive_hash = hashlib.sha256(
              archive_path.read_bytes()
          ).hexdigest()

          if archive_hash != expected_hash.lower():
              raise ValueError("Recovery archive checksum mismatch.")

          history_member = "data/experimental_state/history.csv"
          expected_members = {
              history_member,
              "checkpoint_manifest.json",
              "execution_log.json",
          }

          with ZipFile(archive_path) as archive:
              names = archive.namelist()

              if (
                  len(names) != len(set(names))
                  or set(names) != expected_members
              ):
                  raise ValueError(
                      "Unexpected recovery archive contents."
                  )

              if archive.testzip() is not None:
                  raise ValueError(
                      "Recovery archive integrity check failed."
                  )

              history = archive.read(history_member)
              manifest = json.loads(
                  archive.read("checkpoint_manifest.json")
              )
              log = json.loads(
                  archive.read("execution_log.json")
              )

          history_hash = hashlib.sha256(history).hexdigest()

          if (
              history_hash != manifest["history_sha256"]
              or history_hash != log["input_history_sha256"]
              or len(history) != manifest["history_bytes"]
          ):
              raise ValueError(
                  "Recovery history verification failed."
              )

          if (
              log.get("status") != "success"
              or log.get("mode") != "experimental_mixed_source"
              or log.get("run_id") != manifest["source_pipeline_run"]
              or manifest["source_pipeline_run"]
              != "20261122T220706756385_9f51ee1c"
              or manifest["source_workflow_run"] != 45075782033
          ):
              raise ValueError(
                  "Unexpected recovery checkpoint provenance."
              )

          plan = json.loads(
              (root / "evaluation_plan.json").read_text(
                  encoding="utf-8-sig"
              )
          )

          if (
              manifest["selected_models"] != plan["selected_models"]
              or log["selected_models"] != plan["selected_models"]
          ):
              raise ValueError(
                  "Recovery checkpoint model selection differs."
              )

          rows = list(
              csv.DictReader(
                  io.StringIO(history.decode("utf-8-sig"))
              )
          )

          if (
              not rows
              or len(rows) != manifest["history_rows"]
              or len(rows) != log["history_rows"]
          ):
              raise ValueError(
                  "Recovery history row count mismatch."
              )

          cutoff = datetime.fromisoformat(
              rows[-1]["hour_utc"]
          )

          if (
              cutoff != datetime.fromisoformat(
                  manifest["input_cutoff_utc"]
              )
              or cutoff != datetime.fromisoformat(
                  log["input_cutoff_utc"]
              )
          ):
              raise ValueError(
                  "Recovery history cutoff mismatch."
              )

          destination = (
              root / "data/experimental_state/history.csv"
          )
          destination.parent.mkdir(
              parents=True, exist_ok=True
          )

          temporary = destination.with_suffix(".recovery.tmp")
          temporary.write_bytes(history)
          temporary.replace(destination)

          report = {
              "checkpoint_source": "recovery_release",
              "release_tag": "experimental-state-45075782033-1",
              "source_pipeline_run": manifest["source_pipeline_run"],
              "restored_rows": len(rows),
              "restored_cutoff_utc": cutoff.isoformat(),
              "sha256": history_hash,
              "verification": "passed",
              "note": (
                  "Explicit recovery selection; "
                  "may precede newer runs."
              ),
          }

          (root / "cloud-test/checkpoint_restore.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )

          print("Recovery release checkpoint restored.")
          print(
              "Source pipeline run:",
              manifest["source_pipeline_run"],
          )
          print("History rows:", len(rows))
          print("Input cutoff:", cutoff.isoformat())
          print(
              "Archive and history checksum verification: PASS"
          )
          print(
              "The pipeline will validate continuity before forecasting."
          )
          PY

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r cloud-test/inference-requirements.txt \
            --timeout 300 \
            --retries 5
          python -m pip check
          python -m pip freeze > cloud-test/installed-packages.txt

      - name: Run experimental pipeline
        shell: bash
        run: |
          set -o pipefail
          python run_experimental_pipeline.py 2>&1 \
            | tee cloud-test/pipeline.log

      - name: Publish verified results to dashboard
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          publication_dir="$RUNNER_TEMP/agentweather-dashboard-publication"
          git worktree add --detach "$publication_dir" origin/main

          python publish_dashboard_results.py \
            --destination "$publication_dir/deployment/cloud_data"

          git -C "$publication_dir" config user.name "github-actions[bot]"
          git -C "$publication_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$publication_dir" add -- deployment/cloud_data

          if git -C "$publication_dir" diff --cached --quiet; then
            echo "No dashboard publication changes."
          else
            git -C "$publication_dir" commit \
              -m "Update experimental dashboard forecast"
            git -C "$publication_dir" push origin HEAD:main
          fi

      - name: Save results and updated history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-test-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cloud-test/*.json
            cloud-test/*.txt
            cloud-test/*.log
            data/experimental_forecasts/
            data/experimental_state/history.csv