name: Test Experimental Forecast

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agentweather-experimental-test
  cancel-in-progress: false

jobs:
  test-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "-1"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
      RELEASE_TAG: experimental-models-v1

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download published bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-test/bundles
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir cloud-test/bundles \
            --pattern "selected_models.zip" \
            --pattern "selected_models.zip.sha256" \
            --pattern "initial_history_checkpoint.zip" \
            --pattern "initial_history_checkpoint.zip.sha256"

      - name: Verify and restore bundles
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          bundle_dir = root / "cloud-test" / "bundles"
          report_dir = root / "cloud-test"


          def file_hash(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(1024 * 1024), b""
                  ):
                      digest.update(chunk)
              return digest.hexdigest()


          def restore_bundle(filename, checkpoint=False):
              archive_path = bundle_dir / filename
              checksum_path = bundle_dir / f"{filename}.sha256"
              checksum_parts = checksum_path.read_text(
                  encoding="utf-8"
              ).strip().split()

              if len(checksum_parts) != 2:
                  raise ValueError(
                      f"Invalid checksum file: {checksum_path.name}"
                  )

              expected_hash, expected_name = checksum_parts

              if expected_name != filename:
                  raise ValueError(
                      f"Checksum filename mismatch: {filename}"
                  )

              if not re.fullmatch(r"[0-9a-fA-F]{64}", expected_hash):
                  raise ValueError(f"Invalid SHA-256: {filename}")

              if file_hash(archive_path) != expected_hash.lower():
                  raise ValueError(
                      f"Archive checksum mismatch: {filename}"
                  )

              with ZipFile(archive_path) as archive:
                  names = archive.namelist()

                  if len(names) != len(set(names)):
                      raise ValueError(
                          f"Duplicate archive members: {filename}"
                      )

                  manifest = json.loads(
                      archive.read("bundle_manifest.json")
                  )
                  members = manifest["files"]
                  expected_members = (
                      set(members) | {"bundle_manifest.json"}
                  )

                  if set(names) != expected_members:
                      raise ValueError(
                          f"Unexpected archive contents: {filename}"
                      )

                  # Verify every member before restoring any file.
                  for relative, metadata in members.items():
                      path = PurePosixPath(relative)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or "\\" in relative
                          or ":" in relative
                      ):
                          raise ValueError(
                              f"Unsafe archive path: {relative}"
                          )

                      if checkpoint:
                          allowed = (
                              relative
                              == "data/experimental_state/history.csv"
                          )
                      else:
                          allowed = (
                              relative == "evaluation_plan.json"
                              or relative == "data/splits/train.csv"
                              or relative.startswith("data/models/")
                          )

                      if not allowed:
                          raise ValueError(
                              f"Unexpected file: {relative}"
                          )

                      info = archive.getinfo(relative)
                      mode = info.external_attr >> 16

                      if info.is_dir() or stat.S_ISLNK(mode):
                          raise ValueError(
                              f"Invalid archive member: {relative}"
                          )

                      target = root.joinpath(*path.parts)
                      target.resolve().relative_to(root)

                      digest = hashlib.sha256()
                      size = 0

                      with archive.open(relative) as handle:
                          for chunk in iter(
                              lambda: handle.read(1024 * 1024), b""
                          ):
                              digest.update(chunk)
                              size += len(chunk)

                      if (
                          digest.hexdigest() != metadata["sha256"]
                          or size != metadata["bytes"]
                      ):
                          raise ValueError(
                              f"Member verification failed: {relative}"
                          )

                      if target.exists():
                          if not target.is_file():
                              raise ValueError(
                                  "Destination is not a file: "
                                  f"{relative}"
                              )

                          if file_hash(target) != metadata["sha256"]:
                              if relative == "evaluation_plan.json":
                                  repository_plan = json.loads(
                                      target.read_text(
                                          encoding="utf-8-sig"
                                      )
                                  )
                                  release_plan = json.loads(
                                      archive.read(relative).decode(
                                          "utf-8-sig"
                                      )
                                  )

                                  if repository_plan != release_plan:
                                      raise ValueError(
                                          "Evaluation plan settings differ "
                                          "between repository and release. "
                                          "Review both plans before "
                                          "continuing."
                                      )

                                  print(
                                      "Evaluation plan settings match; "
                                      "only file formatting differs."
                                  )
                              else:
                                  raise ValueError(
                                      "Repository file differs from "
                                      f"release: {relative}"
                                  )

                  # Preserve existing verified files.
                  for relative in members:
                      target = root.joinpath(
                          *PurePosixPath(relative).parts
                      )

                      if target.exists():
                          continue

                      target.parent.mkdir(
                          parents=True, exist_ok=True
                      )

                      with archive.open(relative) as source:
                          with target.open("xb") as destination:
                              shutil.copyfileobj(
                                  source, destination
                              )

              manifest_path = (
                  report_dir / f"{archive_path.stem}_manifest.json"
              )
              manifest_path.write_text(
                  json.dumps(manifest, indent=2),
                  encoding="utf-8",
              )

              print(f"Verified and restored: {filename}")
              return manifest


          models = restore_bundle("selected_models.zip")
          restore_bundle(
              "initial_history_checkpoint.zip",
              checkpoint=True,
          )

          packages = models["environment"]["packages"]
          required_packages = [
              "numpy",
              "pandas",
              "scikit-learn",
              "scipy",
              "joblib",
              "tensorflow",
              "keras",
              "statsmodels",
              "requests",
          ]

          requirements = []

          for name in required_packages:
              package_version = packages[name]

              if not re.fullmatch(
                  r"[0-9A-Za-z.+!_-]+", package_version
              ):
                  raise ValueError(
                      f"Invalid package version for {name}"
                  )

              requirements.append(f"{name}=={package_version}")

          requirements_path = (
              report_dir / "inference-requirements.txt"
          )
          requirements_path.write_text(
              "\n".join(requirements) + "\n",
              encoding="utf-8",
          )

          print("\nRecorded inference dependencies:")
          print(
              requirements_path.read_text(encoding="utf-8")
          )
          print("Bundle verification completed.")
          PY

      - name: Download previous successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45071851566 \
            --repo "$GITHUB_REPOSITORY" \
            --name experimental-test-45071851566-1 \
            --dir cloud-test/previous-run

      - name: Verify and restore previous history
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path.cwd()
          previous = root / "cloud-test/previous-run"
          previous_run_id = "20261122T212430565404_6f15171a"

          previous_run = (
              previous
              / "data/experimental_forecasts"
              / previous_run_id
          )
          checkpoint = (
              previous / "data/experimental_state/history.csv"
          )
          log_path = previous_run / "execution_log.json"
          run_history = previous_run / "input_history.csv"

          for path in (checkpoint, log_path, run_history):
              if not path.is_file():
                  raise FileNotFoundError(
                      f"Required previous-run file missing: {path}"
                  )

          log = json.loads(
              log_path.read_text(encoding="utf-8")
          )

          if log.get("status") != "success":
              raise ValueError(
                  "Previous pipeline did not complete successfully."
              )

          if log.get("run_id") != previous_run_id:
              raise ValueError("Previous run ID does not match.")

          content = checkpoint.read_bytes()
          digest = hashlib.sha256(content).hexdigest()

          if digest != log["input_history_sha256"]:
              raise ValueError(
                  "Previous checkpoint checksum mismatch."
              )

          if content != run_history.read_bytes():
              raise ValueError(
                  "Previous checkpoint differs from its saved run history."
              )

          rows = list(
              csv.DictReader(
                  io.StringIO(content.decode("utf-8-sig"))
              )
          )

          if not rows or len(rows) != log["history_rows"]:
              raise ValueError(
                  "Previous checkpoint row count mismatch."
              )

          last_hour = datetime.fromisoformat(
              rows[-1]["hour_utc"]
          )
          previous_cutoff = datetime.fromisoformat(
              log["input_cutoff_utc"]
          )

          if last_hour != previous_cutoff:
              raise ValueError(
                  "Previous checkpoint cutoff mismatch."
              )

          destination = (
              root / "data/experimental_state/history.csv"
          )

          if not destination.is_file():
              raise FileNotFoundError(
                  "Release checkpoint was not restored."
              )

          original_rows = list(
              csv.DictReader(
                  io.StringIO(
                      destination.read_text(encoding="utf-8-sig")
                  )
              )
          )

          if not original_rows:
              raise ValueError("Release checkpoint is empty.")

          original_cutoff = datetime.fromisoformat(
              original_rows[-1]["hour_utc"]
          )

          if last_hour < original_cutoff:
              raise ValueError(
                  "Previous-run checkpoint is older than "
                  "the release checkpoint."
              )

          temporary = destination.with_suffix(".restore.tmp")
          temporary.write_bytes(content)
          temporary.replace(destination)

          report = {
              "source_workflow_run": 45071851566,
              "source_pipeline_run": previous_run_id,
              "restored_rows": len(rows),
              "restored_cutoff_utc": last_hour.isoformat(),
              "sha256": digest,
              "verification": "passed",
          }

          (root / "cloud-test/checkpoint_restore.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )

          print("Previous successful checkpoint restored.")
          print("Source pipeline run:", previous_run_id)
          print("History rows:", len(rows))
          print("Input cutoff:", last_hour.isoformat())
          print("Checksum verification: PASS")
          print(
              "The pipeline will continue from this saved history."
          )
          PY

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r cloud-test/inference-requirements.txt \
            --timeout 300 \
            --retries 5
          python -m pip check
          python -m pip freeze > cloud-test/installed-packages.txt

      - name: Run experimental pipeline
        shell: bash
        run: |
          set -o pipefail
          python run_experimental_pipeline.py 2>&1 \
            | tee cloud-test/pipeline.log

      - name: Save results and updated history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-test-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cloud-test/*.json
            cloud-test/*.txt
            cloud-test/*.log
            data/experimental_forecasts/
            data/experimental_state/history.csv